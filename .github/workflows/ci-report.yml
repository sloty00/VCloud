name: CI Report VCloud CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del codigo
      uses: actions/checkout@v3

    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Instalar y ejecutar Test
      run: |
        cd backend
        npm install
        
        # Simulamos la existencia de directorios que Prisma pueda buscar
        # para evitar el error de "Prisma Schema not found"
        mkdir -p node_modules/.prisma/client
        
        # Ejecutamos un test simple que importe tu app
        # Si esto funciona, el servidor puede arrancar correctamente
        node -e 'const app = require("./src/index.js"); console.log("App cargada correctamente");' > test-output.txt 2>&1
        
        # Verificamos si el comando anterior tuvo exito
        if [ $? -eq 0 ]; then
          echo '{"numPassedTests": 1, "numFailedTests": 0, "numTotalTests": 1}' > results.json
        else
          echo '{"numPassedTests": 0, "numFailedTests": 1, "numTotalTests": 1}' > results.json
          cat test-output.txt # Esto nos dira el error exacto si falla
        fi

    - name: Generar reporte en JSON
      if: always()
      run: |
        # Este paso toma el resultado y lo deja listo para la web
        cp backend/results.json reporte-cicd.json

    - name: Desplegar reporte
      if: always()
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: .
        branch: gh-pages
