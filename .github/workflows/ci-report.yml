name: CI Report VCloud CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Ejecutar Test y Reportar
      run: |
        # 1. Instalamos dependencias
        cd backend
        npm install
        
        # 2. Intentamos generar prisma sin forzar ruta, 
        # a veces basta con estar en la carpeta donde está el schema
        npx prisma generate
        
        # 3. Ejecutamos el test y guardamos el resultado en la RAÍZ (../)
        if node -e 'const createServer = require("./src/index.js"); const app = createServer(); process.exit(0);' > log.txt 2>&1; then
          echo '{"exitosos": 1, "fallidos": 0, "totales": 1}' > ../results.json
        else
          echo '{"exitosos": 0, "fallidos": 1, "totales": 1}' > ../results.json
        fi

    - name: Generar Reporte Final
      if: always()
      run: |
        # Ahora leemos el JSON directamente de la raíz
        EXITOSOS=$(node -e 'const r=require("./results.json"); console.log(r.exitosos)')
        FALLIDOS=$(node -e 'const r=require("./results.json"); console.log(r.fallidos)')
        TOTAL=$(node -e 'const r=require("./results.json"); console.log(r.totales)')

        echo '{
          "proyecto": "VCloud",
          "rama": "${{ github.ref_name }}",
          "pipeline": { "estado": "${{ job.status }}" },
          "tests": {
            "exitosos": '$EXITOSOS',
            "fallidos": '$FALLIDOS',
            "totales": '$TOTAL'
          }
        }' > reporte-cicd.json

    - name: Deploy
      if: always()
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: .
        branch: gh-pages
