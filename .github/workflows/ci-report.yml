name: VCloud CI

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Configurar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Ejecutar Test y Preparar Reporte
      run: |
        cd backend
        npm install
        
        # 1. Creamos estructura dummy para evitar el error de Prisma
        mkdir -p node_modules/.prisma/client
        
        # 2. Intentamos ejecutar el servidor. Si falla, el pipeline NO se detiene.
        # Guardamos el resultado en un archivo temporal en la raíz.
        node -e 'try { require("./src/index.js"); console.log("OK"); } catch(e) { console.error(e); process.exit(1); }' > ../test-output.txt 2>&1
        
        # 3. Definimos los resultados basados en si el test pasó o falló
        if [ $? -eq 0 ]; then
          echo '{"exitosos": 1, "fallidos": 0, "totales": 1}' > ../reporte-cicd.json
        else
          echo '{"exitosos": 0, "fallidos": 1, "totales": 1}' > ../reporte-cicd.json
        fi

    - name: Desplegar Reporte a GitHub Pages
      if: always()
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: .
        branch: gh-pages
