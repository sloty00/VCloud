name: Report VCloud CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Ejecutar Test y Reportar
      run: |
        cd backend
        echo "Iniciando instalación de dependencias..."
        npm install
        
        # Creamos una estructura dummy para que no falle Prisma si no está la DB
        mkdir -p node_modules/.prisma/client
        
        echo "Ejecutando test..."
        # Intentamos ejecutar el servidor importando el index.js
        # Usamos '|| true' para que el pipeline no se detenga aunque el test falle
        node -e 'const app = require("./src/index.js"); console.log("Carga exitosa");' > test-output.txt 2>&1
        
        # Verificamos si se generó salida y creamos el results.json basado en eso
        if grep -q "Carga exitosa" test-output.txt; then
          echo '{"numPassedTests": 1, "numFailedTests": 0, "numTotalTests": 1}' > results.json
        else
          echo "El test falló. Contenido del log:"
          cat test-output.txt
          echo '{"numPassedTests": 0, "numFailedTests": 1, "numTotalTests": 1}' > results.json
        fi

    - name: Generar reporte en JSON
      if: always()
      run: |
        # Usamos un comando que no falle aunque el archivo no esté en la ruta esperada
        # Buscamos el archivo results.json en todo el proyecto por si acaso
        find . -name "results.json" -exec cp {} reporte-cicd.json \; || echo "No se encontró results.json"

    - name: Desplegar reporte
      if: always()
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: .
        branch: gh-pages
