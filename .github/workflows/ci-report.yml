name: CI Report VCloud CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Run Smoke Test
      run: |
        cd backend
        npm install
        # Ejecutamos el servidor como modulo para verificar salud
        node -e 'const app = require("./src/index.js"); process.exit(0);' > log.txt 2>&1 && STATUS=1 || STATUS=0
        
        # Generamos JSON simple basado en el éxito del requerimiento del modulo
        echo '{"exitosos": '$STATUS', "fallidos": '$(($STATUS == 0 ? 1 : 0))', "totales": 1}' > results.json

    - name: Generate Report
      if: always()
      run: |
        # Extraemos valores para el reporte final
        EXITOSOS=$(node -e 'const r=require("./backend/results.json"); console.log(r.exitosos)')
        FALLIDOS=$(node -e 'const r=require("./backend/results.json"); console.log(r.fallidos)')
        TOTAL=$(node -e 'const r=require("./backend/results.json"); console.log(r.totales)')

        echo '{
          "proyecto": "VCloud",
          "rama": "${{ github.ref_name }}",
          "pipeline": { "estado": "${{ job.status }}" },
          "tests": {
            "exitosos": '$EXITOSOS',
            "fallidos": '$FALLIDOS',
            "totales": '$TOTAL'
          }
        }' > reporte-cicd.json

    - name: Deploy
      if: always()
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: .
        branch: gh-pages
