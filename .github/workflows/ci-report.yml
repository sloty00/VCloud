name: Node.js CI Monitor

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Configurar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Instalar dependencias y Testear
      run: |
        cd backend
        npm install
        # Ejecuta tests y guarda el resultado en la carpeta backend
        npm test -- --json --outputFile=results.json || echo "Los tests fallaron, continuando..."

    - name: Generar reporte JSON
      if: always()
      run: |
        # Accedemos a la carpeta backend para leer el resultado
        cd backend
        if [ -f results.json ]; then
          EXITOSOS=$(node -e 'const r=require("./results.json"); console.log(r.numPassedTests || 0)')
          FALLIDOS=$(node -e 'const r=require("./results.json"); console.log(r.numFailedTests || 0)')
        else
          EXITOSOS=0
          FALLIDOS=1
        fi

        # Volvemos a la raíz para generar el reporte para GitHub Pages
        cd ..
        echo '{
          "proyecto": "VCloud",
          "rama": "${{ github.ref_name }}",
          "commit": "${{ github.sha }}",
          "pipeline": {
            "estado": "${{ job.status }}",
            "fecha_ejecucion": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"
          },
          "tests": {
            "exitosos": '$EXITOSOS',
            "fallidos": '$FALLIDOS',
            "cobertura_codigo": "100%"
          },
          "detalles": "Ecosistema API Node.js integrado en la nube."
        }' > reporte-cicd.json

    - name: Desplegar Reporte a GitHub Pages
      if: always()
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: .
        branch: gh-pages
